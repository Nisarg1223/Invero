<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invero — Curated UI Library & Design Inspiration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
            },
            colors: {
              invero: {
                50: '#f0f7ff',
                100: '#e0effe',
                200: '#bae0fd',
                500: '#0284c7',
                600: '#0066cc',
                700: '#0052a3',
                900: '#0b2b4d',
              }
            },
            boxShadow: {
              'smooth-sm': '0 2px 8px -2px rgba(0, 0, 0, 0.05)',
              'smooth-md': '0 8px 24px -4px rgba(0, 0, 0, 0.06)',
              'smooth-lg': '0 20px 48px -12px rgba(0, 0, 0, 0.09)',
              'smooth-xl': '0 32px 64px -16px rgba(0, 0, 0, 0.12)',
              'glow-blue': '0 0 25px -4px rgba(37, 99, 235, 0.35)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#fbfbfd] text-neutral-900 font-sans antialiased selection:bg-blue-600 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
